services:
  rag-agent:
    build: .
    container_name: eakimat365-rag
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_data
      - ./storage:/app/storage
      - ./pdf:/app/pdf:ro
      - ./prod_data:/app/prod_data:ro
    restart: unless-stopped

volumes:
  chroma_data:
